[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weekly-report-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "charset-normalizer>=3.3,<4",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "lxml>=5.3,<6",
  "pydantic-settings>=2.6,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
  "pywin32>=308,<309; sys_platform == 'win32'",
]

[project.scripts]
weekly-report-assistant = "app.bootstrap:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
